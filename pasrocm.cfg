# ---------------------------------------------------------------------------
# PasROCm - Free Pascal compiler configuration (Tier 2: zero-install)
#
#   cd /path/to/PasROCm
#   fpc @pasrocm.cfg my_rocm_program.pas
#
# The -Fu/-Fl/-I paths below are relative to the current directory, so pass
# this file from the PasROCm checkout root (that also makes it work when
# PasROCm sits inside your project as a git submodule).
#
# /opt/rocm is the standard ROCm install location. If yours lives elsewhere,
# override it on the command line - the later flag wins:
#   fpc @pasrocm.cfg -Fl"$ROCM_PATH/lib" -Fl"$ROCM_PATH/lib64" my_prog.pas
# ---------------------------------------------------------------------------

-Mobjfpc
-Sh
-Fusrc
-Fusrc/rocprim
-Flsrc/rocprim
-Fl/opt/rocm/lib
-Fl/opt/rocm/lib64
-Isrc
