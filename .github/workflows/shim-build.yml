name: shim-build

# Compile the rocPRIM C++ shim against every supported (Ubuntu, ROCm) pair and
# every GPU architecture group, one artifact per (configuration, arch group).
#
#   pull_request  -> profile "pr"    : 1 configuration, 2 targets (2 jobs)
#   push to main  -> profile "smoke" : all configurations, one target set (16 jobs)
#   nightly cron  -> profile "smoke" : the same 16 jobs, every day
#   Sunday cron   -> profile "full"  : all configurations, all targets (54 jobs)
#   manual        -> profile chosen in the "Run workflow" dialog
#
# The two crons exist because minutes are finite: measured 2026-11-14, a smoke
# run costs ~37 billed minutes and a full run ~125, so nightly-full (~3,800 per
# month) does not fit the 2,000-minute allowance, while nightly smoke + weekly
# full (~1,620) does. ci/DESIGN.md sections 5 and 9.
#
# Everything about the matrix comes from ci/supported-builds.json; this file only
# says where to run it. See ci/DESIGN.md sections 5 and 7.

on:
  pull_request:
    paths:
      - 'src/rocprim/**'
      - 'ci/**'
      - '.github/workflows/shim-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/rocprim/**'
      - 'ci/**'
      - '.github/workflows/shim-build.yml'
  schedule:
    # Nightly smoke keeps every SDK line honest; the weekly full matrix is the
    # expensive one. Both fire the same workflow; the profile step tells them
    # apart by github.event.schedule. See the header comment and DESIGN 9.
    - cron: '0 4 * * *'   # nightly  -> smoke (16 jobs)
    - cron: '0 5 * * 0'   # Sunday   -> full  (54 jobs)
  workflow_dispatch:
    inputs:
      profile:
        description: Matrix profile to run
        type: choice
        options: [pr, smoke, full]
        default: pr

permissions:
  contents: read

concurrency:
  # A pull request only needs its newest run; main/scheduled runs are kept.
  group: shim-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate manifest
        run: ci/manifest.sh validate
      - name: Check generated bindings and header are current
        # The ABI specification is hand-edited; the units, the public header and
        # the version script are generated. A stale one is a review finding, not
        # an ABI change.
        run: |
          ci/gen-shim-bindings.sh --check
          ci/gen-shim-header.sh --check
      - name: Choose profile
        id: profile
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          case "$EVENT" in
            pull_request) PROFILE=pr ;;
            push)         PROFILE=smoke ;;
            schedule)
              # Two cron entries fire this workflow. The Sunday one is the full
              # matrix; every other night is smoke. A schedule run can only be
              # told apart by the expression that fired it.
              if [[ "$SCHEDULE" == '0 5 * * 0' ]]; then
                PROFILE=full
              else
                PROFILE=smoke
              fi
              ;;
            *)            PROFILE="${INPUT_PROFILE:-pr}" ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "== profile: $PROFILE"
      - name: Plan matrix
        id: plan
        run: |
          ci/manifest.sh matrix \
            --profile "${{ steps.profile.outputs.profile }}" \
            --github-output
      - name: Summarize plan
        run: |
          {
            echo "### shim build plan"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| profile | \`${{ steps.profile.outputs.profile }}\` |"
            echo "| jobs | ${{ steps.plan.outputs.count }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.config }} / ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Provision ROCm ${{ matrix.sdk_line }} (${{ matrix.sdk_version }})
        run: ci/install-rocm.sh --config "${{ matrix.config }}"

      - name: Build, self-test and ABI-check (${{ matrix.target }}, wave ${{ matrix.wavefront }})
        run: |
          ci/build-linux.sh \
            --config "${{ matrix.config }}" \
            --target "${{ matrix.target }}" \
            --skip-install

      - name: Upload package
        if: matrix.artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.config }}__${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summarize job
        if: always()
        run: |
          {
            echo "### ${{ matrix.config }} / ${{ matrix.target }}"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| mode | \`${{ matrix.mode }}\` |"
            echo "| ROCm | \`${{ matrix.sdk_line }}\` (\`${{ matrix.sdk_version }}\`) |"
            echo "| compiler | \`${{ matrix.compiler }}\` |"
            echo "| target | \`${{ matrix.target }}\` |"
            echo "| wavefront | \`${{ matrix.wavefront }}\` (widths \`${{ matrix.widths }}\`) |"
            if compgen -G "dist/*.tar.gz" >/dev/null; then
              echo
              echo '```'
              sha256sum dist/*.tar.gz || true
              ls -lh dist/*.tar.gz || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
